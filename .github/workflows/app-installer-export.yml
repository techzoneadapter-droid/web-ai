name: Export verified Windows installers
on:
  push:
    branches: [app-installer-export-20261015]
    paths: ['.github/workflows/app-installer-export.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download and SHA256 verify official installer releases
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,urllib.request,time,hashlib,json
          assets = [["01_StoryFlow","StoryFlow-Setup-1.0.83-x64.exe","https://github.com/techzoneadapter-droid/tool-ytb/releases/download/v1.0.83/StoryFlow-Setup-1.0.83-x64.exe",286119113,"5182003912e8e75edd8cbc40c9770f455d43be317394300ec2c6f633d6292a57"],["02_VietTruyen","VietTruyen-Setup-1.0.43.exe","https://github.com/techzoneadapter-droid/viettruyen/releases/download/v1.0.43/VietTruyen-Setup-1.0.43.exe",101829434,"2d81aae2cc8f53d5cd31edf6d6b97b426e69ee27a1916ef8c14a7b668454665e"],["03_PageBot","PageBot-AI-Studio-Setup-0.3.9.exe","https://github.com/techzoneadapter-droid/chatbot/releases/download/desktop-v0.3.9/PageBot-AI-Studio-Setup-0.3.9.exe",111702850,"c2c039d928f32f2aea3fc512ae18da1d175c4da22700a8157b0d15cde38cce7a"],["04_FB_Cookie","FB-Cookie-Token-Tool-Setup-1.4.13.exe","https://github.com/techzoneadapter-droid/fb-cookie-desktop/releases/download/v1.4.13/FB-Cookie-Token-Tool-Setup-1.4.13.exe",82014360,"d92806a07a58c28ab2c7f9f05dede8460de4efb8539e10f9c2d3d725927c9d4c"],["05_AKMaster","AKMasterSocical-Setup-1.0.0.19.exe","https://github.com/techzoneadapter-droid/tous/releases/download/v1.0.0.19/AKMasterSocical-Setup-1.0.0.19.exe",10503060,"e56d1c40bac3b9c9f37db65c3e0d73889478889a79155a15955b2f2c6cd448e5"],["06_Vibaocode","Vibaocode-Setup-0.2.13.exe","https://github.com/techzoneadapter-droid/vibaocode/releases/download/v0.2.13/Vibaocode-Setup-0.2.13.exe",160275963,"87d76f6973a0ab3e0813af0962b76b4938cbca4ff3ad9cfb23ab169a5c2681c0"],["07_BPet","BPet-Setup.exe","https://github.com/techzoneadapter-droid/bpet/releases/download/v1.0.22/BPet-Setup.exe",78609056,"8cab4feb50b6ec7c501fd11bed613dcce16808e8236b352bce279f7e8f776d34"]]
          root=pathlib.Path("installers");root.mkdir(exist_ok=True)
          for directory,name,url,size,checksum in assets:
            folder=root/directory;folder.mkdir(exist_ok=True)
            target=folder/name
            for attempt in range(3):
              try:
                print("Downloading",name,flush=True)
                request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 InstallerBackup/1.0"})
                with urllib.request.urlopen(request,timeout=180) as response,open(target,"wb") as out:
                  while True:
                    chunk=response.read(2*1024*1024)
                    if not chunk:break
                    out.write(chunk)
                digest=hashlib.file_digest(open(target,"rb"),"sha256").hexdigest()
                assert target.stat().st_size == size,(name,"size mismatch",target.stat().st_size,size)
                assert digest == checksum,(name,"sha256 mismatch",digest,checksum)
                print("VERIFIED",name,flush=True)
                break
              except Exception as e:
                print("Attempt failed",attempt+1,repr(e),flush=True)
                target.unlink(missing_ok=True)
                if attempt==2:raise
                time.sleep(5)
          (root/"manifest.json").write_text(json.dumps(assets,indent=2),encoding="utf-8")

          PY
      - name: Upload collected installers for backup
        uses: actions/upload-artifact@v4
        with:
          name: WIN-Installers-20261015
          path: installers/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
